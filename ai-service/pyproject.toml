[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tokopilot-ai-service"
version = "0.1.0"
description = "TokoPilot AI orchestration service (LLM adapter, prompt assembly, tool-call parsing). No database access by design."
requires-python = ">=3.12"
# INVARIANT: no database drivers/ORMs here. tests/test_invariants.py enforces it.
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic-settings>=2.16,<3",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.2,<10",
  "ruff>=0.17,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = []
# Deliberate Indonesian typography in user-facing answers.
allowed-confusables = ["–", "“", "”", "…", "−", "•"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
