# Local development stack. Frontend runs with `pnpm dev` (Vite proxy -> api:8080).
# Never use these settings in production.
name: tokopilot

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tokopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tokopilot}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tokopilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-tokopilot}?sslmode=disable
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # Deliberately has no DATABASE_URL and no network path requirement to postgres.
  ai-service:
    build: ./ai-service
    environment:
      APP_ENV: ${APP_ENV:-development}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
    ports:
      - "127.0.0.1:${AI_PORT:-8000}:8000"

volumes:
  pgdata:
