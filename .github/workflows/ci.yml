name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tokopilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tokopilot" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Integration tests create and drop their own throwaway databases.
      TEST_DATABASE_URL: postgresql://tokopilot:ci-only-password@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...

  ai-service:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ai-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: No invisible characters in source (raw backspace, NBSP, BOM …)
        run: python ../scripts/check_text.py
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.5.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: frontend/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Lockfile has no duplicate packages (two vitest copies break jest-dom)
        run: pnpm dedupe --check
      - run: pnpm exec eslint . --max-warnings 0
      - run: pnpm exec vitest run
      - run: pnpm run build

  # Release images must build from a clean checkout (no push from CI yet — registry not chosen).
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t tokopilot-api:ci backend
      - run: docker build -t tokopilot-ai:ci ai-service
